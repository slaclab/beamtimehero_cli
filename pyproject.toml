[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamtimehero_cli"
version = "0.4.0"
description = "Generic CLI for SSRL BL15-2 beamline: SPEC injection, scan data reads, log reads, action logging."
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "silx",
    "numpy",
    "pandas",
    "scipy",
    "lmfit",
    "xraydb",
    "sqlmodel",
    "pyyaml",
    "matplotlib",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Slack messaging tools. Pulled lazily inside notify/slack.py so the bare
# install can run without slack-sdk if no deployment needs Slack.
slack = [
    "slack-sdk",
]
# Postgres-backed scan data (used by deployments where bldata_converter
# populates BL15-2_scan_metadata, like the playground k8s pod). Lazy
# import inside spec_data/postgres_backend.py.
postgres = [
    "psycopg2-binary",
]

[project.scripts]
beamtimehero = "beamtimehero_cli.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beamtimehero_cli = [
    "refdocs/defaults/*.md",
    "science/README.md",
    # definitions.py reads manifest.json at import; without these two the
    # reference-image tools silently degrade to an empty manifest on any
    # install that is not `pip install -e`.
    "reference_images/manifest.json",
    "reference_images/*.jpg",
]

[tool.ruff]
# Deliberately narrow: pyflakes plus syntax errors. This is a correctness gate,
# not a style gate — undefined names, dead imports, dead locals, f-strings that
# forgot their placeholders. Formatting rules are left out on purpose so the
# gate never argues with a scientist about import order in the middle of a
# physics change.
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]

# No per-file lint ignores. The pre-science/ re-export shims that needed them
# were removed on 2026-09-11; every import path now points at its real module.
